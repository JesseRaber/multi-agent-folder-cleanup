name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Run OpenAI skill validator
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py \
            --output /tmp/openai-quick-validate.py
          python /tmp/openai-quick-validate.py skills/multi-agent-folder-cleanup
      - name: Run OpenAI plugin validator
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/codex/2b7c279735d0d096cf7b34fe98938f46792f4d4f/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py \
            --output /tmp/validate_plugin.py
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/codex/2b7c279735d0d096cf7b34fe98938f46792f4d4f/codex-rs/skills/src/assets/samples/plugin-creator/scripts/identifier_validation.py \
            --output /tmp/identifier_validation.py
          python /tmp/validate_plugin.py .
      - name: Run package checks
        run: python -m unittest tests/test_package.py -v
      - name: Compile Python scripts
        run: python -m compileall -q skills/multi-agent-folder-cleanup/scripts tests
      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "skills/multi-agent-folder-cleanup/scripts/audit_folder.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
      - name: Run all regression and parity tests
        run: python -m unittest discover -s tests -v

  windows:
    # The reparse-point, placeholder, PowerShell 5.1 and cp1252 code paths only
    # exist on Windows. Run the whole suite there with both PowerShell editions.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Tests with PowerShell 7
        run: python -m unittest discover -s tests -v
      - name: Parse and smoke-test under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "skills/multi-agent-folder-cleanup/scripts/audit_folder.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $root = Join-Path $env:RUNNER_TEMP 'ps51'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'real') | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'real\inside.md') -Value 'x' -Encoding UTF8
          $outside = Join-Path $env:RUNNER_TEMP 'outside'
          New-Item -ItemType Directory -Force -Path $outside | Out-Null
          Set-Content -LiteralPath (Join-Path $outside 'external.md') -Value 'y' -Encoding UTF8
          cmd /c mklink /J (Join-Path $root 'junction') $outside | Out-Null
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File skills/multi-agent-folder-cleanup/scripts/audit_folder.ps1 -Root $root *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Files \(all\):\s+1\b') { Write-Error 'PS 5.1 miscounted files'; exit 1 }
          if ($out -notmatch 'junction') { Write-Error 'PS 5.1 did not report the junction'; exit 1 }
