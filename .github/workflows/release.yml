name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Builds artifacts only; does not publish.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      # The skill declares its own version. If the tag and the skill disagree,
      # one of them is wrong — stop rather than ship a mislabeled package.
      - name: Check tag matches SKILL.md metadata.version
        run: |
          python3 - "${{ steps.ver.outputs.version }}" <<'EOF'
          import sys, yaml
          tag = sys.argv[1]
          text = open('skills/multi-agent-folder-cleanup/SKILL.md', encoding='utf-8').read()
          fm = yaml.safe_load(text.split('---')[1])
          declared = str(fm.get('metadata', {}).get('version', ''))
          if declared != tag:
              sys.exit(f"Version mismatch: tag says {tag}, SKILL.md says {declared}")
          print(f"Version agrees: {tag}")
          EOF

      - name: Validate skill frontmatter
        run: |
          python3 - <<'EOF'
          import sys, yaml
          text = open('skills/multi-agent-folder-cleanup/SKILL.md', encoding='utf-8').read()
          if not text.startswith('---'):
              sys.exit("SKILL.md has no YAML frontmatter")
          fm = yaml.safe_load(text.split('---')[1])
          for key in ('name', 'description'):
              if not fm.get(key):
                  sys.exit(f"SKILL.md frontmatter missing required key: {key}")
          if fm['name'] != 'multi-agent-folder-cleanup':
              sys.exit(f"frontmatter name {fm['name']!r} does not match the skill folder")
          if len(fm['description']) > 1024:
              sys.exit(f"description is {len(fm['description'])} chars; limit is 1024")
          print("Frontmatter OK")
          EOF

      - name: Validate plugin manifest
        run: python3 -c "import json; json.load(open('.claude-plugin/plugin.json')); print('plugin.json OK')"

      - name: Compile Python scripts
        run: python3 -m compileall -q skills/multi-agent-folder-cleanup/scripts

      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $errs = $null; $tok = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "skills/multi-agent-folder-cleanup/scripts/audit_folder.ps1",
            [ref]$tok, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Error "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "audit_folder.ps1 parses clean"

      # Smoke test: the audit scripts must actually run, and both languages
      # must agree. A package that ships a script nobody executed is the
      # failure mode this repo exists to argue against.
      - name: Smoke test the audit scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf/docs /tmp/tf/archive
          printf 'same\n' > /tmp/tf/docs/plan.md
          printf 'same\n' > /tmp/tf/archive/plan_FINAL_v3.md
          printf '# Index\n- [Plan](docs/plan.md)\n' > /tmp/tf/INDEX.md

          python3 skills/multi-agent-folder-cleanup/scripts/audit_folder.py \
            --root /tmp/tf --index-path INDEX.md --hash-files > /tmp/py.txt
          pwsh -File skills/multi-agent-folder-cleanup/scripts/audit_folder.ps1 \
            -Root /tmp/tf -IndexPath INDEX.md -HashFiles > /tmp/ps.txt

          grep -q 'plan_FINAL_v3.md' /tmp/py.txt || { echo "python audit missed the duplicate"; exit 1; }
          grep -q 'plan_FINAL_v3.md' /tmp/ps.txt || { echo "powershell audit missed the duplicate"; exit 1; }
          echo "Both audit scripts ran and found the duplicate group"

      - name: Smoke test verify_move.py
        shell: bash
        run: |
          set -uo pipefail
          printf 'source,target\n/tmp/tf/docs/plan.md,/tmp/tf/archive/moved.md\n' > /tmp/moves.csv
          python3 skills/multi-agent-folder-cleanup/scripts/verify_move.py \
            baseline --map /tmp/moves.csv --out /tmp/baseline.json
          python3 skills/multi-agent-folder-cleanup/scripts/verify_move.py \
            verify --baseline /tmp/baseline.json
          # The move was never performed, so verify MUST fail. If it passes,
          # the check that guards every Execute run is broken.
          if [ $? -eq 0 ]; then
            echo "verify_move.py reported success on an un-performed move"
            exit 1
          fi
          echo "verify_move.py correctly failed on an un-performed move"

      - name: Build packages
        id: build
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SRC=skills/multi-agent-folder-cleanup
          rm -rf build dist && mkdir -p dist

          # --- portable: the bare skill folder, for ChatGPT / Grok / Codex / local ---
          mkdir -p build/portable
          cp -r "$SRC" build/portable/multi-agent-folder-cleanup
          cp LICENSE build/portable/
          cp packaging/INSTALL-portable.md build/portable/INSTALL.md

          # --- claude: plugin layout with the manifest where the loader expects it ---
          mkdir -p build/claude/multi-agent-folder-cleanup
          cp -r skills build/claude/multi-agent-folder-cleanup/
          cp -r .claude-plugin build/claude/multi-agent-folder-cleanup/
          cp LICENSE README.md CHANGELOG.md build/claude/multi-agent-folder-cleanup/
          cp packaging/INSTALL-claude.md build/claude/multi-agent-folder-cleanup/INSTALL.md

          find build -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          find build -name '*.pyc' -delete

          (cd build/portable && zip -qr "../../dist/multi-agent-folder-cleanup-$VERSION-portable.zip" .)
          (cd build/claude && zip -qr "../../dist/multi-agent-folder-cleanup-$VERSION-claude.zip" multi-agent-folder-cleanup)
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

          echo "--- built ---"
          ls -lh dist
          cat dist/SHA256SUMS.txt

      # Prove the shipped ZIP actually works, rather than asserting it.
      - name: Verify the built packages
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          rm -rf /tmp/x && mkdir -p /tmp/x/portable /tmp/x/claude
          unzip -q "dist/multi-agent-folder-cleanup-$VERSION-portable.zip" -d /tmp/x/portable
          unzip -q "dist/multi-agent-folder-cleanup-$VERSION-claude.zip" -d /tmp/x/claude

          test -f /tmp/x/portable/multi-agent-folder-cleanup/SKILL.md
          test -f /tmp/x/claude/multi-agent-folder-cleanup/.claude-plugin/plugin.json
          test -f /tmp/x/claude/multi-agent-folder-cleanup/skills/multi-agent-folder-cleanup/SKILL.md

          if find /tmp/x -name __pycache__ | grep -q .; then
            echo "__pycache__ leaked into a package"; exit 1
          fi

          python3 /tmp/x/portable/multi-agent-folder-cleanup/scripts/audit_folder.py --root /tmp/tf > /dev/null
          echo "Both packages extract and run"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES=packaging/RELEASE_NOTES_v$VERSION.md
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Multi-Agent Folder Cleanup v$VERSION" \
              --notes-file "$NOTES" \
              dist/*.zip dist/SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Multi-Agent Folder Cleanup v$VERSION" \
              --generate-notes \
              dist/*.zip dist/SHA256SUMS.txt
          fi
