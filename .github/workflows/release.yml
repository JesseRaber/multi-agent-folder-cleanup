name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0). Builds artifacts only; does not publish.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Check package versions agree
        run: |
          python3 - "${{ steps.ver.outputs.version }}" <<'EOF'
          import json, sys, yaml
          tag = sys.argv[1]
          text = open('skills/multi-agent-folder-cleanup/SKILL.md', encoding='utf-8').read()
          fm = yaml.safe_load(text.split('---')[1])
          versions = {
              'SKILL.md': str(fm.get('metadata', {}).get('version', '')),
              '.codex-plugin/plugin.json': json.load(open('.codex-plugin/plugin.json'))['version'],
              '.claude-plugin/plugin.json': json.load(open('.claude-plugin/plugin.json'))['version'],
          }
          mismatches = {name: value for name, value in versions.items() if value != tag}
          if mismatches:
              sys.exit(f"Version mismatch: build says {tag}, packages say {mismatches}")
          catalog = json.load(open('.claude-plugin/marketplace.json'))
          names = [p.get('name') for p in catalog.get('plugins', [])]
          if 'multi-agent-folder-cleanup' not in names:
              sys.exit('marketplace.json does not list multi-agent-folder-cleanup')
          print(f"All package versions agree: {tag}")
          EOF

      - name: Run OpenAI skill validator
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py \
            --output /tmp/openai-quick-validate.py
          python /tmp/openai-quick-validate.py skills/multi-agent-folder-cleanup

      - name: Run OpenAI plugin validator
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/codex/2b7c279735d0d096cf7b34fe98938f46792f4d4f/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py \
            --output /tmp/validate_plugin.py
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/openai/codex/2b7c279735d0d096cf7b34fe98938f46792f4d4f/codex-rs/skills/src/assets/samples/plugin-creator/scripts/identifier_validation.py \
            --output /tmp/identifier_validation.py
          python /tmp/validate_plugin.py .

      - name: Run package checks
        run: python -m unittest tests/test_package.py -v

      - name: Validate skill frontmatter
        run: |
          python3 - <<'EOF'
          import sys, yaml
          text = open('skills/multi-agent-folder-cleanup/SKILL.md', encoding='utf-8').read()
          if not text.startswith('---'):
              sys.exit("SKILL.md has no YAML frontmatter")
          fm = yaml.safe_load(text.split('---')[1])
          for key in ('name', 'description'):
              if not fm.get(key):
                  sys.exit(f"SKILL.md frontmatter missing required key: {key}")
          if fm['name'] != 'multi-agent-folder-cleanup':
              sys.exit(f"frontmatter name {fm['name']!r} does not match the skill folder")
          if len(fm['description']) > 1024:
              sys.exit(f"description is {len(fm['description'])} chars; limit is 1024")
          print("Frontmatter OK")
          EOF

      - name: Compile Python scripts
        run: python3 -m compileall -q skills/multi-agent-folder-cleanup/scripts tests

      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $errs = $null; $tok = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "skills/multi-agent-folder-cleanup/scripts/audit_folder.ps1",
            [ref]$tok, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Error "line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "audit_folder.ps1 parses clean"

      - name: Smoke test the audit scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tf/docs /tmp/tf/archive
          printf 'same\n' > /tmp/tf/docs/plan.md
          printf 'same\n' > /tmp/tf/archive/plan_FINAL_v3.md
          printf '# Index\n- [Plan](docs/plan.md)\n' > /tmp/tf/INDEX.md

          python3 skills/multi-agent-folder-cleanup/scripts/audit_folder.py \
            --root /tmp/tf --index-path INDEX.md --hash-files > /tmp/py.txt
          pwsh -File skills/multi-agent-folder-cleanup/scripts/audit_folder.ps1 \
            -Root /tmp/tf -IndexPath INDEX.md -HashFiles > /tmp/ps.txt

          grep -q 'plan_FINAL_v3.md' /tmp/py.txt || { echo "python audit missed the duplicate"; exit 1; }
          grep -q 'plan_FINAL_v3.md' /tmp/ps.txt || { echo "powershell audit missed the duplicate"; exit 1; }
          echo "Both audit scripts ran and found the duplicate group"

      - name: Smoke test verify_move.py
        shell: bash
        run: |
          set -euo pipefail
          printf 'source,target\n/tmp/tf/docs/plan.md,/tmp/tf/archive/moved.md\n' > /tmp/moves.csv
          python3 skills/multi-agent-folder-cleanup/scripts/verify_move.py \
            baseline --map /tmp/moves.csv --out /tmp/baseline.json
          if python3 skills/multi-agent-folder-cleanup/scripts/verify_move.py \
               verify --baseline /tmp/baseline.json; then
            echo "verify_move.py reported success on an un-performed move"
            exit 1
          fi
          echo "verify_move.py correctly failed on an un-performed move"

      - name: Build packages
        id: build
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SRC=skills/multi-agent-folder-cleanup
          rm -rf build dist && mkdir -p dist

          mkdir -p build/portable
          cp -r "$SRC" build/portable/multi-agent-folder-cleanup
          cp LICENSE build/portable/
          cp packaging/INSTALL-portable.md build/portable/INSTALL.md

          mkdir -p build/openai/multi-agent-folder-cleanup
          cp -r skills build/openai/multi-agent-folder-cleanup/
          cp -r .codex-plugin build/openai/multi-agent-folder-cleanup/
          cp LICENSE README.md CHANGELOG.md build/openai/multi-agent-folder-cleanup/
          cp packaging/INSTALL-openai.md build/openai/multi-agent-folder-cleanup/INSTALL.md

          mkdir -p build/claude/multi-agent-folder-cleanup
          cp -r skills build/claude/multi-agent-folder-cleanup/
          cp -r .claude-plugin build/claude/multi-agent-folder-cleanup/
          cp LICENSE README.md CHANGELOG.md build/claude/multi-agent-folder-cleanup/
          cp packaging/INSTALL-claude.md build/claude/multi-agent-folder-cleanup/INSTALL.md

          find build -name __pycache__ -type d -exec rm -rf {} + 2>/dev/null || true
          find build -name '*.pyc' -delete

          (cd build/portable && zip -qr "../../dist/multi-agent-folder-cleanup-$VERSION-portable.zip" .)
          (cd build/openai && zip -qr "../../dist/multi-agent-folder-cleanup-$VERSION-openai.zip" multi-agent-folder-cleanup)
          (cd build/claude && zip -qr "../../dist/multi-agent-folder-cleanup-$VERSION-claude.zip" multi-agent-folder-cleanup)
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

          echo "--- built ---"
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Verify the built packages
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          rm -rf /tmp/x && mkdir -p /tmp/x/portable /tmp/x/openai /tmp/x/claude
          unzip -q "dist/multi-agent-folder-cleanup-$VERSION-portable.zip" -d /tmp/x/portable
          unzip -q "dist/multi-agent-folder-cleanup-$VERSION-openai.zip" -d /tmp/x/openai
          unzip -q "dist/multi-agent-folder-cleanup-$VERSION-claude.zip" -d /tmp/x/claude

          test -f /tmp/x/portable/multi-agent-folder-cleanup/SKILL.md
          test -f /tmp/x/openai/multi-agent-folder-cleanup/.codex-plugin/plugin.json
          test -f /tmp/x/openai/multi-agent-folder-cleanup/skills/multi-agent-folder-cleanup/agents/openai.yaml
          test -f /tmp/x/claude/multi-agent-folder-cleanup/.claude-plugin/plugin.json
          test -f /tmp/x/claude/multi-agent-folder-cleanup/skills/multi-agent-folder-cleanup/SKILL.md

          if find /tmp/x -name __pycache__ | grep -q .; then
            echo "__pycache__ leaked into a package"; exit 1
          fi

          python3 /tmp/x/portable/multi-agent-folder-cleanup/scripts/audit_folder.py --root /tmp/tf > /dev/null
          python3 /tmp/x/openai/multi-agent-folder-cleanup/skills/multi-agent-folder-cleanup/scripts/audit_folder.py --root /tmp/tf > /dev/null
          echo "All packages extract and run"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES=packaging/RELEASE_NOTES_v$VERSION.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
            if [ -f "$NOTES" ]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"
            fi
          elif [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Multi-Agent Folder Cleanup v$VERSION" \
              --notes-file "$NOTES" \
              dist/*.zip dist/SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Multi-Agent Folder Cleanup v$VERSION" \
              --generate-notes \
              dist/*.zip dist/SHA256SUMS.txt
          fi
